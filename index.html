<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="投影与视图">
<meta name="theme-color" content="#d9d9d9">
<title>投影与视图 · 3D 教学</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --blue: #3478f6; --green: #34c759; --label: #111; --sub: #6e6e73;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #d9d9d9; font-family: var(--font); color: var(--label); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
#c { position: fixed; inset: 0; display: block; touch-action: none; outline: none; }
#hint { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 14px); text-align: center; pointer-events: none; line-height: 1.45; }
#hint .by { font-size: 13px; font-weight: 600; color: #7a7a80; letter-spacing: .2px; }
#hint .tip { font-size: 13px; color: #4f4f55; margin-top: 3px; }
#sheet {
  position: fixed; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) * 0.4 + 8px);
  max-width: 560px; margin: 0 auto; height: min(56vh, 560px);
  border-radius: 28px; background: rgba(255,255,255,.72);
  -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%);
  box-shadow: 0 12px 44px rgba(0,0,0,.16), 0 0 0 .5px rgba(255,255,255,.7) inset;
  transform: translateY(calc(100% - 92px)); transition: transform .42s cubic-bezier(.2,.85,.25,1);
  display: flex; flex-direction: column; overflow: hidden; z-index: 5;
}
#sheet.open { transform: translateY(0); }
#grab { flex: none; padding: 8px 0 0; cursor: pointer; touch-action: none; }
#grab .handle { width: 40px; height: 5px; border-radius: 3px; background: rgba(60,60,67,.32); margin: 0 auto; }
#grab h1 { margin: 12px 16px 8px; font-size: 18px; font-weight: 700; text-align: center; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#grab .peek { text-align: center; font-size: 12.5px; color: var(--sub); margin-top: -2px; transition: opacity .25s; }
#sheet.open #grab .peek { opacity: 0; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 22px 26px; overscroll-behavior: contain; }
.sec-h { display: flex; align-items: center; justify-content: space-between; font-size: 17px; font-weight: 600; color: var(--sub); margin: 18px 0 10px; }
.sec-h .link { font: 600 15px var(--font); color: var(--blue); background: none; border: 0; padding: 4px 2px; cursor: pointer; }
.select { position: relative; display: block; }
.select select { -webkit-appearance: none; appearance: none; width: 100%; height: 48px; padding: 0 44px 0 14px; font: 500 17px var(--font); color: var(--label);
  background: rgba(244,245,251,.92); border: 1px solid rgba(90,110,170,.22); border-radius: 12px; outline: none; }
.select svg { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.seg { position: relative; display: flex; height: 44px; padding: 3px; border-radius: 22px; background: rgba(118,118,128,.13); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 19px; background: #fff;
  box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .3s cubic-bezier(.2,.85,.25,1); }
.seg button { position: relative; flex: 1; border: 0; background: none; font: 600 15.5px var(--font); color: #1c1c1e; cursor: pointer; padding: 0; white-space: nowrap; }
.row { display: flex; align-items: center; justify-content: space-between; min-height: 44px; font-size: 16.5px; }
.row + .row { border-top: .5px solid rgba(60,60,67,.14); }
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 16px; background: rgba(120,120,128,.18); transition: background .25s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .25s cubic-bezier(.2,.85,.25,1); }
.switch input:checked + i { background: var(--green); }
.switch input:checked + i::after { transform: translateX(20px); }
.sl { display: flex; align-items: center; gap: 10px; height: 40px; }
.sl label { width: 40px; font-size: 16.5px; flex: none; }
.sl output { width: 46px; text-align: right; font: 13px ui-monospace, "SF Mono", Menlo, monospace; color: #8e8e93; flex: none; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 32px; margin: 0; background: transparent; --p: 50%; cursor: pointer; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--blue) var(--p), rgba(120,120,128,.22) var(--p)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 38px; height: 26px; margin-top: -11px; border-radius: 13px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.08); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(120,120,128,.22); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--blue); }
input[type=range]::-moz-range-thumb { width: 38px; height: 26px; border: 0; border-radius: 13px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
#lightBox { margin-top: 10px; padding: 6px 12px 8px; border-radius: 14px; background: rgba(255,255,255,.55); }
#lightBox[hidden] { display: none; }
#lightBox .lh { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--sub); padding: 4px 0 0; }
#mag { font-size: 12.5px; color: #8a5a00; line-height: 1.5; padding-top: 2px; }
.btn { display: block; width: 100%; height: 44px; margin-top: 12px; border: 0; border-radius: 12px; background: rgba(118,118,128,.12); font: 600 16px var(--font); color: var(--blue); cursor: pointer; }
.foot { text-align: center; color: #8e8e93; font-size: 12px; margin-top: 20px; }
@media (min-width: 760px) { #sheet { left: auto; right: 20px; width: 400px; height: min(78vh, 720px); } }
</style>
</head>
<body>
<canvas id="c" aria-label="三投影面 3D 场景"></canvas>
<header id="hint">
  <div class="by">Designed by Benjamin Xu</div>
  <div class="tip">单指旋转视角 · 双指缩放 · 点击底部按钮展开控制台</div>
</header>
<section id="sheet" aria-label="控制台">
  <div id="grab" role="button" aria-label="展开或收起控制台">
    <div class="handle"></div>
    <h1>Benjamin Xu · 投影与视图 3D 教学</h1>
    <div class="peek">点这里展开控制台</div>
  </div>
  <div class="scroll">
    <div class="sec-h">几何体</div>
    <label class="select">
      <select id="solid" aria-label="几何体"></select>
      <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#3c3c43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7l4-4 4 4M2 13l4 4 4-4"/></svg>
    </label>

    <div class="sec-h">投影光源模式</div>
    <div class="seg" id="mode"><div class="thumb"></div><button data-v="ortho">平行光（正投影）</button><button data-v="central">点光源（中心投影）</button></div>
    <div id="lightBox" hidden>
      <div class="lh"><span>投射中心位置（每个投影面前各一个）</span><button class="link" id="resetLight" style="font:600 14px var(--font);color:var(--blue);background:none;border:0">复位</button></div>
      <div class="sl"><label for="lx">距离</label><input type="range" id="lx" min="4" max="8.6" step="0.01"><output id="lxv">0</output></div>
      <div class="sl"><label for="ly">左右</label><input type="range" id="ly" min="4" max="8.6" step="0.01"><output id="lyv">0</output></div>
      <div class="sl"><label for="lz">上下</label><input type="range" id="lz" min="4" max="8.6" step="0.01"><output id="lzv">0</output></div>
      <div id="mag"></div>
    </div>

    <div class="sec-h">三视图</div>
    <div class="row"><span>叠加显示三视图</span><label class="switch"><input type="checkbox" id="views"><i></i></label></div>

    <div class="sec-h">手动变换 <button class="link" id="resetRot">复位</button></div>
    <div class="sl"><label for="rx">旋 X</label><input type="range" id="rx" min="-180" max="180" step="1"><output id="rxv">0°</output></div>
    <div class="sl"><label for="ry">旋 Y</label><input type="range" id="ry" min="-180" max="180" step="1"><output id="ryv">0°</output></div>
    <div class="sl"><label for="rz">旋 Z</label><input type="range" id="rz" min="-180" max="180" step="1"><output id="rzv">0°</output></div>

    <div class="sec-h">更多</div>
    <div class="row"><span>展开三视图</span><label class="switch"><input type="checkbox" id="unfold"><i></i></label></div>
    <div class="row"><span>显示投射线</span><label class="switch"><input type="checkbox" id="rays"><i></i></label></div>
    <div class="row"><span>显示投影</span><label class="switch"><input type="checkbox" id="shadows"><i></i></label></div>
    <div class="row"><span>显示坐标轴</span><label class="switch"><input type="checkbox" id="axes"><i></i></label></div>
    <button class="btn" id="resetView">视角复位（双击场景也可以）</button>
    <div class="foot">Designed by Benjamin Xu · 45 种几何体全部免费</div>
  </div>
</section>
<script type="module" src="./app.min.js"></script>
</body>
</html>
