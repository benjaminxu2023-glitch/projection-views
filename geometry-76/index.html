<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f5f7"><title>投影与视图 · 3D 教学</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body>
<canvas id="scene" aria-label="可拖动旋转的三维几何体"></canvas>
<header><div class="brand"><span class="brand-icon">◇</span><span>投影与视图<span class="brand-sub">空间几何实验室</span></span></div><div class="header-actions"><span class="live-dot"></span><span class="desktop-label">交互式 3D 教学</span><button id="member" class="icon-button" aria-label="会员">♕</button></div></header>
<div class="credit">Designed by TiantianYe<p>单指旋转视角 · 双指缩放 · 点击底部按钮展开控制台</p></div>
<div class="scene-caption"><span class="dot"></span><span id="shape-caption">正方体</span><span class="divider"></span><span id="mode-caption">正投影 · 三视图</span></div>
<div class="view-tools"><button id="reset-camera" title="恢复默认视角" aria-label="恢复默认视角">⌖</button><button id="zoom-in" title="放大" aria-label="放大">＋</button><button id="zoom-out" title="缩小" aria-label="缩小">−</button></div>
<button class="open-controls" id="open-controls">☷ <span>控制台</span><span class="up">⌃</span></button>
<section id="controls" class="sheet open" aria-label="控制台"><button class="grab" id="close-controls" aria-label="收起控制台"><span></span></button><div class="sheet-inner"><div class="sheet-heading"><h1>TiantianYe · 投影与视图 3D 教学</h1><span class="small-tag">探索空间</span></div>
<div class="control-body"><label class="field-label shape-label" for="shape">几何体 <span id="shape-count"></span></label><div class="select-wrap"><span class="cube-small">◇</span><select id="shape"><option value="cube">正方体</option></select></div>
<label class="field-label">投影光源模式</label><div class="segmented"><button class="active" data-mode="parallel">平行光（正投影）</button><button data-mode="point">点光源（中心投影）</button></div>
<div class="section-label">三视图</div><div class="toggle-row"><label for="projections">叠加显示三视图</label><input id="projections" type="checkbox" role="switch" checked></div>
<div class="section-label rotation-heading">手动变换 <button id="reset">重置</button></div><div id="sliders"></div>
<div class="panel-footer"><span><i></i> 实时投影</span><button id="auto">⟳ 自动旋转</button><button id="membership-link">♕ 会员界面</button></div></div></div></section>
<div id="modal" class="modal" hidden><button class="backdrop" aria-label="关闭弹窗"></button><section class="member-sheet"><button class="modal-close" aria-label="关闭">×</button><span class="member-symbol">♕</span><h2>投影与视图会员</h2><p>丰富几何体已全部开放，无需购买</p><button class="plan"><span><strong>周会员</strong><small>演示方案 · 图形已全部开放</small></span><b>US$0.99<small>/周</small></b></button><button class="plan"><span><strong>月会员</strong><small>演示方案 · 图形已全部开放</small></span><b>US$0.99<small>/月</small></b></button><button class="plan recommended"><span class="best">超值之选</span><span><strong>年度会员</strong><small>演示方案 · 图形已全部开放</small></span><b>US$2.99<small>/年</small></b></button><div class="demo-note">界面演示 · 暂未接入应用内购买</div><button id="restore">恢复购买</button><div class="legal"><button data-legal="隐私政策">隐私政策</button><button data-legal="使用条款">使用条款</button></div></section></div><div id="toast" role="status"></div><script src="geometry.js"></script><script src="app.js"></script></body></html>
